[pytest]
# Only tests/ is collected. Several device scripts at the repo root match pytest's
# default *_test.py pattern (uart_bridge_test.py) but import `machine`, so a bare
# collection sweep fails before any real test runs.
testpaths = tests

# Puts the repo root on sys.path so tests can import the device modules directly,
# which is what scripts/run_tests.sh used PYTHONPATH=. for.
pythonpath = .

addopts = -q
