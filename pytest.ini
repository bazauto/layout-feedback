[pytest]
# Only tests/ is collected. Device scripts elsewhere in the tree match pytest's
# default *_test.py pattern and import `machine`, so a bare collection sweep would
# fail before any real test ran.
testpaths = tests

# src/lib is on the path because that is where it lands on the device: MicroPython
# puts /lib on sys.path, so a node imports `mqtt_at`, not `lib.mqtt_at`. Tests import
# device modules by exactly the name the board uses.
pythonpath = src/lib

addopts = -q
