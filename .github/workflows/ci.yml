name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest

      # The host suite stubs `machine` and `utime`, so nothing here needs a board.
      # pytest.ini pins testpaths and pythonpath — see the note there about the
      # device scripts that match pytest's default collection pattern.
      - name: Run host tests
        run: python -m pytest
